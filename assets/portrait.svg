<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="ikeP のポートレート（仮）">
  <defs>
    <clipPath id="pf"><rect width="400" height="500"/></clipPath>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c29a63"/>
      <stop offset="1" stop-color="#866237"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#pf)">
    <rect width="400" height="500" fill="#efe6d6"/>

    <!-- 背後のAIノード（ごく控えめ・真鍮の点） -->
    <g stroke="#a9814e" stroke-width="1" opacity="0.4">
      <line x1="300" y1="70" x2="346" y2="118"/>
      <line x1="346" y1="118" x2="314" y2="168"/>
    </g>
    <g fill="#a9814e" opacity="0.75">
      <circle cx="300" cy="70" r="3"/><circle cx="346" cy="118" r="2.2"/><circle cx="314" cy="168" r="1.8"/>
    </g>

    <!-- 肩 -->
    <path d="M64 500c0-86 61-132 136-132s136 46 136 132z" fill="#2a2219"/>
    <!-- 首 -->
    <rect x="172" y="300" width="56" height="86" rx="24" fill="#c9b38f"/>
    <!-- 頭 -->
    <ellipse cx="200" cy="236" rx="86" ry="100" fill="#d8c7a8"/>
    <!-- 髪 -->
    <path d="M114 234c-6-72 42-120 86-120s92 48 86 120c-10-58-44-86-86-86s-76 28-86 86z" fill="#2a2219"/>
    <path d="M114 234c-6-72 42-120 86-120 18 0 34 6 47 16-16-8-33-8-47-2-36 16-52 54-51 98z" fill="#3a2f22"/>
    <!-- リムライト（右・真鍮） -->
    <path d="M286 236c0 56-38 100-86 100 40-10 70-52 70-100s-30-90-70-100c48 0 86 44 86 100z" fill="url(#rim)" opacity="0.5"/>
    <!-- 顔（最小） -->
    <g fill="#2a2219"><ellipse cx="170" cy="230" rx="5.5" ry="7"/><ellipse cx="230" cy="230" rx="5.5" ry="7"/></g>
    <path d="M182 276c11 10 25 10 36 0" fill="none" stroke="#a9814e" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
